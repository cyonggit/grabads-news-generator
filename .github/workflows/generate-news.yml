name: Generate SEA Ad News

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install feedparser python-dateutil requests

      - name: Generate news.json
        run: python generate_news.py

      - name: Verify news.json was created
        run: |
          echo "news.json preview:"
          head -30 news.json

      - name: Publish to gh-pages branch
        run: |
          git config user.email "github-actions-bot@grabads"
          git config user.name "GrabAds Bot"

          # Save files to temp before switching branches
          cp news.json /tmp/news.json
          cp sea-news-widget-grab.html /tmp/index.html

          # Switch to gh-pages branch or create it fresh
          if git ls-remote --exit-code --heads origin gh-pages; then
            git fetch origin gh-pages
            rm -f news.json sea-news-widget-grab.html
            git checkout gh-pages
          else
            git checkout --orphan gh-pages
            git rm -rf . 2>/dev/null || true
          fi

          # Copy files from temp location
          cp /tmp/news.json ./news.json
          cp /tmp/index.html ./index.html

          # Commit and push
          git add news.json index.html
          git diff --cached --quiet && echo "No changes." || git commit -m "chore: update news widget"
          git push origin gh-pages
          echo "Published successfully!"
